<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="InHaus">
  <meta name="theme-color" content="#2D3B24">
  <title>InHaus Inspector</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <script>
    // Unregister any existing service workers immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => r.unregister());
      });
    }
  </script>
  <script src="db.js"></script>
  <script src="ui.js"></script>
  <script type="module" src="app.js"></script>
  <div style="position:fixed;top:8px;right:10px;background:#6b7280;color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;z-index:9999;pointer-events:none;opacity:0.6;"id="version-badge">v103</div>
</body>
</html>
