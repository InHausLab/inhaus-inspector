<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="InHaus">
  <meta name="theme-color" content="#2D3B24">
  <title>InHaus Inspector</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">v</div>
  <script>
    // Service worker registration - safe iOS Safari pattern
    // NO skipWaiting (causes Safari freeze), YES clients.claim in activate
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js', {
        updateViaCache: 'none' // bypass GitHub Pages caching of sw.js
      }).then(reg => {
        reg.addEventListener('updatefound', () => {
          var newSW = reg.installing;
          newSW.addEventListener('statechange', () => {
            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
              // Show update banner - don't force reload mid-inspection
              var banner = document.createElement('div');
              banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#1d4ed8;color:#fff;padding:12px 16px;font-size:14px;font-weight:600;z-index:99999;display:flex;justify-content:space-between;align-items:center;';
              banner.innerHTML = 'App update available <button id="sw-update-btn" style="background:#fff;color:#1d4ed8;border:none;padding:6px 12px;border-radius:4px;font-weight:700;cursor:pointer;">Reload</button>';
              document.body.appendChild(banner);
              document.getElementById('sw-update-btn').addEventListener('click', function() {
                if (newSW && newSW.state === 'installed') {
                  newSW.postMessage({ type: 'SKIP_WAITING' });
                  navigator.serviceWorker.addEventListener('controllerchange', function() {
                    window.location.reload();
                  });
                } else {
                  window.location.reload();
                }
              });
            }
          });
        });
      }).catch(err => {
        console.warn('SW registration failed:', err);
      });
    }
  </script>
  <script src="db.js?v=238"></script>
  <script src="ui.js?v=238"></script>
  <script type="module" src="app.js?v=238"></script>
  <div style="position:fixed;top:8px;right:10px;background:#6b7280;color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;z-index:9999;pointer-events:none;opacity:0.6;"id="version-badge">v238</div>
</body>
</html>
