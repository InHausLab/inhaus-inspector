<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07101f">
  <title>InHaus Mission Control</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050b16;
      --panel: #0b1424;
      --panel-2: #101c30;
      --line: #22314a;
      --text: #f7f9fc;
      --muted: #91a0b8;
      --blue: #1d4ed8;
      --blue-bright: #3b82f6;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% -10%, rgba(29, 78, 216, .24), transparent 34rem),
        linear-gradient(180deg, #07101f 0%, var(--bg) 48%, #030711 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .shell {
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 8px 0 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand-row { display: flex; align-items: center; gap: 14px; }

    .mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 1px solid #4169e1;
      border-radius: 12px;
      background: linear-gradient(145deg, #2563eb, #163da9);
      box-shadow: 0 0 30px rgba(29, 78, 216, .34);
      font-weight: 900;
      letter-spacing: -.05em;
    }

    h1 { margin: 0; font-size: clamp(1.15rem, 2.2vw, 1.65rem); letter-spacing: .09em; }
    .eyebrow { margin: 0 0 3px; color: #76a7ff; font-size: .72rem; font-weight: 800; letter-spacing: .2em; }

    .header-right { display: flex; align-items: center; gap: 18px; }
    .clock { min-width: 132px; text-align: right; font-size: 1.5rem; font-variant-numeric: tabular-nums; font-weight: 750; }
    .clock-date { display: block; margin-top: 2px; color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }

    .refresh-button {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid #3264e8;
      border-radius: 10px;
      background: var(--blue);
      color: white;
      cursor: pointer;
      font-weight: 800;
    }

    .refresh-button:hover { background: #2563eb; }
    .refresh-button:disabled { cursor: wait; opacity: .62; }

    .control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .live-label { display: inline-flex; align-items: center; gap: 9px; color: #d9e5fa; font-weight: 750; }
    .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 5px rgba(34, 197, 94, .12); }
    #countdown { color: white; font-variant-numeric: tabular-nums; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr));
      gap: 20px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(16, 28, 48, .98), rgba(8, 17, 31, .98));
      box-shadow: 0 18px 50px rgba(0, 0, 0, .26);
    }

    .status-line { height: 4px; background: var(--status); box-shadow: 0 0 18px color-mix(in srgb, var(--status) 60%, transparent); }
    .card-body { padding: 21px; }

    .card-top { display: flex; justify-content: space-between; gap: 20px; }
    .inspection-id { margin-bottom: 7px; color: #7da7ff; font-size: .74rem; font-weight: 850; letter-spacing: .1em; }
    .address { margin: 0; font-size: clamp(1.18rem, 2.2vw, 1.55rem); line-height: 1.2; }
    .client { margin: 7px 0 0; color: var(--muted); font-size: .92rem; }

    .status-badge {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      padding: 7px 10px;
      border: 1px solid color-mix(in srgb, var(--status) 55%, #22314a);
      border-radius: 999px;
      color: var(--status);
      background: color-mix(in srgb, var(--status) 10%, transparent);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      margin: 20px 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--line);
    }

    .metric { min-width: 0; padding: 13px 12px; background: rgba(8, 17, 31, .88); }
    .metric-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: .64rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .metric-value { display: block; overflow: hidden; text-overflow: ellipsis; font-size: .9rem; font-weight: 800; white-space: nowrap; }
    .metric-value.large { color: #8ab4ff; font-size: 1.15rem; }

    .section-title { margin: 0 0 10px; color: #bac7da; font-size: .7rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 18px; }
    .photo { position: relative; min-height: 112px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #080f1c; }
    .photo img { display: block; width: 100%; height: 100%; min-height: 112px; object-fit: cover; }
    .photo-label { position: absolute; right: 0; bottom: 0; left: 0; padding: 16px 8px 7px; overflow: hidden; background: linear-gradient(transparent, rgba(0,0,0,.86)); font-size: .68rem; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .photo-empty { display: grid; place-items: center; min-height: 112px; color: #6f7f98; font-size: .8rem; text-align: center; }

    .rooms { display: flex; flex-wrap: wrap; gap: 7px; }
    .room { padding: 7px 9px; border: 1px solid #293a56; border-radius: 8px; background: #0a1425; color: #c2cee0; font-size: .76rem; }
    .room strong { margin-left: 5px; color: white; }

    .message {
      grid-column: 1 / -1;
      display: grid;
      place-items: center;
      min-height: 280px;
      padding: 40px;
      border: 1px dashed #2a3d5c;
      border-radius: 16px;
      background: rgba(9, 18, 33, .72);
      color: var(--muted);
      text-align: center;
    }

    .message strong { display: block; margin-bottom: 7px; color: white; font-size: 1.15rem; }
    .error-detail { max-width: 760px; margin-top: 8px; color: #fca5a5; font-size: .8rem; }
    .updated { text-align: right; }

    @media (max-width: 720px) {
      .shell { padding: 16px; }
      header { align-items: flex-start; }
      .header-right { align-items: flex-end; flex-direction: column; gap: 10px; }
      .clock { font-size: 1.12rem; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .photos { gap: 6px; }
      .photo, .photo img, .photo-empty { min-height: 90px; }
      .control-bar { align-items: flex-start; flex-direction: column; gap: 7px; }
      .updated { text-align: left; }
    }

    @media (max-width: 440px) {
      .mark { display: none; }
      h1 { letter-spacing: .045em; }
      .refresh-button { padding: 0 12px; }
      .card-top { flex-direction: column; gap: 12px; }
      .status-badge { align-self: flex-start; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand-row">
        <div class="mark" aria-hidden="true">IH</div>
        <div>
          <p class="eyebrow">LIVE OPERATIONS</p>
          <h1>INHAUS MISSION CONTROL</h1>
        </div>
      </div>
      <div class="header-right">
        <div class="clock" id="clock" aria-label="Current time"></div>
        <button class="refresh-button" id="refresh" type="button">Refresh now</button>
      </div>
    </header>

    <section class="control-bar" aria-label="Dashboard status">
      <div class="live-label"><span class="pulse" aria-hidden="true"></span>LIVE INSPECTION ACTIVITY</div>
      <div class="updated"><span id="last-updated">Connecting…</span> · Next refresh in <strong id="countdown">30</strong>s</div>
    </section>

    <section class="grid" id="dashboard" aria-live="polite" aria-busy="true">
      <div class="message"><div><strong>Loading inspections…</strong>Connecting to live operations data.</div></div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const WORKER_URL = 'https://inhaus-photo-worker.inhauslab.workers.dev';
      const REVIEW_TOKEN = 'InHaus2026';
      const LIST_URL = `${WORKER_URL}/inspections/active`;
      const PHOTO_URL = `${WORKER_URL}/inspection-photos`;
      const REFRESH_SECONDS = 30;

      const dashboard = document.getElementById('dashboard');
      const refreshButton = document.getElementById('refresh');
      const countdownNode = document.getElementById('countdown');
      const updatedNode = document.getElementById('last-updated');
      const clockNode = document.getElementById('clock');

      let secondsRemaining = REFRESH_SECONDS;
      let refreshInFlight = false;

      function validDate(value) {
        const date = value ? new Date(value) : null;
        return date && !Number.isNaN(date.getTime()) ? date : null;
      }

      function formatClock() {
        const now = new Date();
        clockNode.replaceChildren(
          document.createTextNode(now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })),
          Object.assign(document.createElement('span'), {
            className: 'clock-date',
            textContent: now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })
          })
        );
      }

      function formatDate(value) {
        const date = validDate(value + 'T12:00:00');
        return date ? date.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : 'Not set';
      }

      function relativeTime(date) {
        if (!date) return 'No photos';
        const elapsedSeconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
        if (elapsedSeconds < 60) return `${elapsedSeconds}s ago`;
        const minutes = Math.floor(elapsedSeconds / 60);
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ${minutes % 60}m ago`;
        const days = Math.floor(hours / 24);
        return `${days}d ${hours % 24}h ago`;
      }

      function elapsedTime(first, last) {
        if (!first || !last) return 'Not started';
        const minutes = Math.max(0, Math.floor((last - first) / 60000));
        if (minutes < 60) return `${minutes}m`;
        const hours = Math.floor(minutes / 60);
        return `${hours}h ${minutes % 60}m`;
      }

      function statusFor(lastPhoto) {
        if (!lastPhoto) return { label: 'No photos', color: 'var(--red)' };
        const minutes = (Date.now() - lastPhoto.getTime()) / 60000;
        if (minutes < 5) return { label: 'Active now', color: 'var(--green)' };
        if (minutes <= 15) return { label: 'Standing by', color: 'var(--yellow)' };
        return { label: 'Inactive', color: 'var(--red)' };
      }

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function metric(label, value, large = false) {
        const node = element('div', 'metric');
        node.append(element('span', 'metric-label', label));
        node.append(element('span', `metric-value${large ? ' large' : ''}`, value));
        return node;
      }

      function roomCounts(photos) {
        const counts = new Map();
        for (const photo of photos) {
          const room = String(photo.roomName || photo.stepName || 'Unassigned').trim() || 'Unassigned';
          counts.set(room, (counts.get(room) || 0) + 1);
        }
        return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      }

      function createCard(inspection) {
        const photos = inspection.photos
          .map(photo => ({ ...photo, parsedTimestamp: validDate(photo.timestamp) }))
          .sort((a, b) => (a.parsedTimestamp?.getTime() || 0) - (b.parsedTimestamp?.getTime() || 0));
        const firstPhoto = photos.find(photo => photo.parsedTimestamp)?.parsedTimestamp || null;
        const lastPhoto = [...photos].reverse().find(photo => photo.parsedTimestamp)?.parsedTimestamp || null;
        const status = statusFor(lastPhoto);

        const card = element('article', 'card');
        card.style.setProperty('--status', status.color);
        card.append(element('div', 'status-line'));
        const body = element('div', 'card-body');
        const top = element('div', 'card-top');
        const identity = element('div');
        identity.append(element('div', 'inspection-id', inspection.inspectionId || inspection.id || 'UNKNOWN INSPECTION'));
        identity.append(element('h2', 'address', inspection.propertyAddress || 'Address unavailable'));
        identity.append(element('p', 'client', inspection.clientName || 'Client not listed'));
        const badge = element('div', 'status-badge');
        badge.append(element('span', 'status-dot'), document.createTextNode(status.label));
        top.append(identity, badge);

        const metrics = element('div', 'metrics');
        metrics.append(
          metric('Inspector', inspection.inspectorName || 'Unassigned'),
          metric('Inspection date', formatDate(inspection.inspectionDate || '')),
          metric('Elapsed', elapsedTime(firstPhoto, lastPhoto)),
          metric('Photos', String(photos.length), true)
        );

        body.append(top, metrics);
        body.append(element('h3', 'section-title', `Last activity · ${relativeTime(lastPhoto)}`));

        const photoGrid = element('div', 'photos');
        const latestPhotos = photos.slice(-3).reverse();
        if (!latestPhotos.length) {
          const empty = element('div', 'photo-empty', inspection.photoError ? 'Photos unavailable' : 'No photos uploaded');
          empty.style.gridColumn = '1 / -1';
          photoGrid.append(empty);
        } else {
          for (const photo of latestPhotos) {
            const frame = element('div', 'photo');
            const image = new Image();
            image.loading = 'lazy';
            image.alt = photo.caption || `${photo.roomName || 'Inspection'} photo`;
            image.src = photo.url;
            image.addEventListener('error', () => {
              image.remove();
              frame.prepend(element('div', 'photo-empty', 'Image unavailable'));
            }, { once: true });
            frame.append(image, element('div', 'photo-label', photo.roomName || photo.stepName || 'Unassigned'));
            photoGrid.append(frame);
          }
        }
        body.append(photoGrid);

        body.append(element('h3', 'section-title', 'Room breakdown'));
        const rooms = element('div', 'rooms');
        const breakdown = roomCounts(photos);
        if (!breakdown.length) {
          rooms.append(element('span', 'room', inspection.photoError || 'No room activity yet'));
        } else {
          for (const [roomName, count] of breakdown) {
            const room = element('span', 'room');
            room.append(document.createTextNode(roomName), element('strong', '', String(count)));
            rooms.append(room);
          }
        }
        body.append(rooms);
        card.append(body);
        return card;
      }

      async function fetchJson(url, authorized = false) {
        const response = await fetch(url, {
          cache: 'no-store',
          headers: authorized ? { Authorization: `Bearer ${REVIEW_TOKEN}` } : {}
        });
        if (!response.ok) throw new Error(`Request failed (${response.status})`);
        const data = await response.json();
        if (data.status && data.status !== 'ok') throw new Error(data.message || `Service returned ${data.status}`);
        return data;
      }

      async function fetchPhotos(inspection) {
        const inspectionId = inspection.inspectionId || inspection.id;
        if (!inspectionId) return { ...inspection, photos: [], photoError: 'Missing inspection ID' };
        const params = new URLSearchParams({ inspectionId, token: inspectionId.toLowerCase() });
        try {
          const data = await fetchJson(`${PHOTO_URL}?${params}`);
          return { ...inspection, photos: Array.isArray(data) ? data : (Array.isArray(data.photos) ? data.photos : []) };
        } catch (error) {
          return { ...inspection, photos: [], photoError: error.message };
        }
      }

      async function refreshDashboard() {
        if (refreshInFlight) return;
        refreshInFlight = true;
        refreshButton.disabled = true;
        refreshButton.textContent = 'Refreshing…';
        dashboard.setAttribute('aria-busy', 'true');

        try {
          const listData = await fetchJson(LIST_URL, true);
          const inspections = Array.isArray(listData) ? listData : (Array.isArray(listData.inspections) ? listData.inspections : []);
          const hydrated = await Promise.all(inspections.map(fetchPhotos));
          dashboard.replaceChildren();
          if (!hydrated.length) {
            const message = element('div', 'message');
            const content = element('div');
            content.append(element('strong', '', 'No active inspections'), document.createTextNode('The dashboard will check again automatically.'));
            message.append(content);
            dashboard.append(message);
          } else {
            hydrated.sort((a, b) => String(b.inspectionDate || '').localeCompare(String(a.inspectionDate || '')));
            dashboard.append(...hydrated.map(createCard));
          }
          updatedNode.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
        } catch (error) {
          const message = element('div', 'message');
          const content = element('div');
          content.append(element('strong', '', 'Unable to load inspections'));
          content.append(document.createTextNode('The dashboard will retry automatically.'));
          content.append(element('div', 'error-detail', error.message));
          message.append(content);
          dashboard.replaceChildren(message);
          updatedNode.textContent = 'Last refresh failed';
        } finally {
          refreshInFlight = false;
          refreshButton.disabled = false;
          refreshButton.textContent = 'Refresh now';
          dashboard.setAttribute('aria-busy', 'false');
          secondsRemaining = REFRESH_SECONDS;
          countdownNode.textContent = String(secondsRemaining);
        }
      }

      refreshButton.addEventListener('click', refreshDashboard);
      setInterval(() => {
        secondsRemaining -= 1;
        if (secondsRemaining <= 0) refreshDashboard();
        countdownNode.textContent = String(Math.max(0, secondsRemaining));
      }, 1000);
      setInterval(formatClock, 1000);

      formatClock();
      refreshDashboard();
    })();
  </script>
</body>
</html>
